[preset.0]

name="Windows Desktop"
platform="Windows Desktop"
runnable=true
advanced_options=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
; Keep the dev-only bulk OUT of the shipped PCK. scratchpad/ alone is ~17 MB of
; generation experiments, and docs/tools/backups have no business in a player build.
exclude_filter="scratchpad/*, docs/*, tools/*, *.bak, *.PREV.bak, *.ORIG.bak, *.md"
export_path="build/Spacewalker.exe"
patches=PackedStringArray()
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

